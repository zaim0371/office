<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaim's Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111;
  --paper:#fff7e0;
  --yellow:#ffe14d;
  --pink:#ff7ab8;
  --blue:#6ec1ff;
  --green:#7dff9b;
  --red:#ff4d3d;
  --bd:5px solid var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  background:var(--paper);
  background-image:radial-gradient(var(--ink) 1.4px,transparent 1.6px);
  background-size:22px 22px;
  color:var(--ink);
  display:flex;flex-direction:column;
  min-height:100vh;overflow-x:hidden;
}

/* ===== HEADER ===== */
header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 22px;
  background:var(--ink);color:var(--paper);
  border-bottom:var(--bd);
  animation:drop .6s cubic-bezier(.2,1.4,.4,1) both;
}
.logo{
  font-family:'Archivo Black',Impact,sans-serif;
  font-size:clamp(22px,3.4vw,40px);letter-spacing:-1px;
  display:flex;align-items:center;gap:12px;
}
.logo i{
  display:inline-block;width:.8em;height:.8em;background:var(--yellow);
  border:3px solid var(--paper);
  animation:spin 6s steps(8) infinite;
}
.status{
  font-weight:700;font-size:14px;
  background:var(--yellow);color:var(--ink);
  border:3px solid var(--paper);padding:6px 12px;
  box-shadow:4px 4px 0 var(--pink);
  display:flex;align-items:center;gap:8px;
}
.status b{width:10px;height:10px;background:var(--red);border-radius:50%;animation:blink 1s steps(2) infinite}

/* ===== COLUMNS ===== */
main{
  flex:1;min-height:380px;
  display:flex;gap:22px;
  padding:6px 22px 94px;
}
.col{
  --c:var(--yellow);
  flex:1 1 0;min-width:0;
  position:relative;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:24px 22px;
  background:var(--c);
  border:var(--bd);
  box-shadow:12px 12px 0 var(--ink);
  color:var(--ink);text-decoration:none;
  overflow:hidden;
  transition:flex-grow .55s cubic-bezier(.2,1.2,.3,1),transform .2s,box-shadow .2s,background .2s;
  animation:rise .8s cubic-bezier(.2,1.3,.4,1) both;
  animation-delay:calc(var(--i) * 130ms + 250ms);
}
.col:nth-child(1){--c:var(--yellow);--i:0}
.col:nth-child(2){--c:var(--pink);--i:1}
.col:nth-child(3){--c:var(--blue);--i:2}
.col:nth-child(4){--c:var(--green);--i:3}

/* hover: kolom melebar, bergeser, bayangan membesar */
main:hover .col{flex-grow:.7}
main .col:hover{
  flex-grow:2.2;
  transform:translate(-6px,-6px) rotate(-.6deg);
  box-shadow:20px 20px 0 var(--ink);
  background:var(--c);
}
.col:active{
  transform:translate(8px,8px);
  box-shadow:0 0 0 var(--ink);
  transition-duration:.08s;
}
.col:focus-visible{outline:6px solid var(--red);outline-offset:4px}

/* garis diagonal yang menyapu saat hover */
.col::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(-45deg,transparent 0 18px,rgba(0,0,0,.08) 18px 36px);
  transform:translateX(-101%);transition:transform .5s ease;
  pointer-events:none;
}
.col:hover::before{transform:translateX(0)}

.tag{
  align-self:flex-start;
  font-weight:700;font-size:14px;
  background:var(--ink);color:var(--paper);
  padding:6px 12px;border:3px solid var(--ink);
  transform:rotate(-3deg);
  transition:transform .3s cubic-bezier(.2,1.6,.4,1);
}
.col:hover .tag{transform:rotate(3deg) scale(1.12)}

.big{
  font-family:'Archivo Black',Impact,sans-serif;
  font-size:clamp(30px,5.2vw,104px);
  line-height:.9;letter-spacing:-2px;
  text-transform:uppercase;
  word-break:break-word;
  position:relative;
}
.col:nth-child(1) .big{-webkit-text-stroke:0}
.desc{
  font-weight:700;font-size:clamp(14px,1.4vw,19px);line-height:1.35;
  max-width:28ch;margin-top:14px;
  position:relative;
}
.go{
  position:relative;
  align-self:stretch;
  display:flex;align-items:center;justify-content:space-between;
  font-family:'Archivo Black',Impact,sans-serif;
  font-size:20px;
  background:var(--paper);
  border:var(--bd);padding:12px 16px;
  box-shadow:6px 6px 0 var(--ink);
  transition:background .2s,color .2s,box-shadow .2s,transform .2s;
}
.go svg{width:34px;height:34px;transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.col:hover .go{background:var(--ink);color:var(--paper);box-shadow:10px 10px 0 var(--red)}
.col:hover .go svg{transform:translateX(8px) rotate(-45deg) scale(1.2)}

/* stiker mengambang */
.sticker{
  position:absolute;right:-14px;top:70px;
  width:74px;height:74px;display:grid;place-items:center;
  background:var(--c);border:var(--bd);
  font-family:'Archivo Black',Impact,sans-serif;font-size:30px;
  clip-path:polygon(50% 0,61% 20%,85% 15%,80% 39%,100% 50%,80% 61%,85% 85%,61% 80%,50% 100%,39% 80%,15% 85%,20% 61%,0 50%,20% 39%,15% 15%,39% 20%);
  background:var(--red);color:var(--ink);
  animation:spin 8s linear infinite;
  opacity:0;transform:scale(0);transition:.35s cubic-bezier(.2,1.6,.4,1);
}
.col:hover .sticker{opacity:1;transform:scale(1)}

/* ===== MARQUEE ===== */
footer{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding-bottom:env(safe-area-inset-bottom,0);
  background:var(--yellow);
  border-top:var(--bd);
  overflow:hidden;white-space:nowrap;
  padding:10px 0;
  animation:rise .6s .9s both;
}
.track{display:inline-flex;animation:scroll 18s linear infinite}
footer:hover .track{animation-play-state:paused}
.track span{
  font-family:'Archivo Black',Impact,sans-serif;font-size:20px;
  padding-right:2.2rem;
}


/* ===== PIN MODAL ===== */
.col.locked:hover .go svg{transform:scale(1.2) rotate(-8deg)}
.pin-overlay{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  padding:16px;background:rgba(17,17,17,.7);
}
.pin-overlay.open{display:flex}
.pin-box{
  width:min(360px,100%);
  background:var(--yellow);border:var(--bd);
  box-shadow:12px 12px 0 var(--ink);
  padding:22px 20px 20px;
  animation:rise .35s cubic-bezier(.2,1.3,.4,1) both;
}
.pin-box.shake{animation:shake .4s}
.pin-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.pin-title{font-family:'Archivo Black',Impact,sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:-1px}
.pin-close{
  width:38px;height:38px;cursor:pointer;
  font-family:'Archivo Black',Impact,sans-serif;font-size:18px;
  background:var(--paper);color:var(--ink);border:4px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
}
.pin-close:active{transform:translate(3px,3px);box-shadow:none}
.pin-sub{font-weight:700;font-size:14px;margin-bottom:16px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:8px}
.pin-dots i{width:22px;height:22px;border:4px solid var(--ink);background:var(--paper);transition:background .12s,transform .12s}
.pin-dots i.on{background:var(--ink);transform:scale(1.1)}
.pin-err{min-height:22px;text-align:center;font-weight:700;font-size:14px;color:var(--red);margin-bottom:8px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-pad button{
  height:56px;cursor:pointer;
  font-family:'Archivo Black',Impact,sans-serif;font-size:24px;
  background:var(--paper);color:var(--ink);
  border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  transition:transform .08s,box-shadow .08s,background .15s;
}
.pin-pad button:hover{background:var(--pink)}
.pin-pad button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.pin-pad button.ok{background:var(--green)}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}


/* ===== PANEL WIDGET (neo brutalism) ===== */
.hbtn{
  font:800 clamp(14px,3.4vw,18px) 'Space Grotesk',system-ui,sans-serif;cursor:pointer;
  background:var(--paper);color:var(--ink);border:3px solid var(--paper);padding:8px 16px;
  box-shadow:4px 4px 0 var(--pink);
}
.hbtn:active{transform:translate(4px,4px);box-shadow:none}
.wrap{width:100%;max-width:1000px;margin:0 auto;padding:22px 22px 6px}
.panel{
  background:#fff;border:var(--bd);box-shadow:12px 12px 0 var(--ink);
  padding:clamp(12px,3vw,24px) 0 clamp(12px,2.5vw,20px);overflow:hidden;
  animation:rise .7s .15s cubic-bezier(.2,1.3,.4,1) both;
}
.tabs{display:flex;gap:clamp(6px,1.6vw,14px);padding:0 clamp(14px,3.4vw,30px);margin-bottom:clamp(12px,2.6vw,20px)}
.tab{
  flex:1;min-width:0;cursor:pointer;
  font-family:'Archivo Black',Impact,sans-serif;font-size:clamp(11px,2.6vw,15px);text-transform:uppercase;
  background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:transform .1s,box-shadow .1s,background .15s;
}
.tab:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.tab[data-i="0"].on{background:var(--green)}
.tab[data-i="1"].on{background:var(--pink)}
.tab[data-i="2"].on{background:var(--blue)}
.tab[data-i="3"].on{background:var(--yellow)}
.tab:focus-visible,.dots button:focus-visible,.c:focus-visible{outline:5px solid var(--red);outline-offset:3px}
.vp{overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pgs{display:flex;transition:transform .45s cubic-bezier(.2,.9,.3,1);will-change:transform}
.pg{
  --c:var(--yellow);
  flex:0 0 100%;min-width:0;padding:26px clamp(16px,3.6vw,32px) 24px;
  display:flex;flex-direction:column;gap:clamp(14px,3vw,24px);
}
.pg:nth-child(1){--c:var(--green)}.pg:nth-child(2){--c:var(--pink)}
.pg:nth-child(3){--c:var(--blue)}.pg:nth-child(4){--c:var(--yellow)}
.r1{display:flex;gap:clamp(14px,3vw,24px);height:clamp(340px,64vw,500px)}
.r2{display:flex;gap:clamp(14px,3vw,24px);height:clamp(132px,23vw,190px)}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.c{
  --pd:clamp(10px,2.4vw,18px);--r:0deg;--chip:var(--c);position:relative;
  display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;
  background:#fff;color:var(--ink);text-decoration:none;
  border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
  padding:var(--pd);transform:rotate(var(--r));-webkit-user-drag:none;
  transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s;
}
a.c:hover{transform:perspective(800px) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg)) translate(-3px,-3px) rotate(var(--r));box-shadow:9px 9px 0 var(--ink)}
a.c:active{transform:translate(4px,4px) rotate(var(--r));box-shadow:0 0 0 var(--ink)}
.r1 .wd{flex:1.78}.r1 .tl{flex:1}.r2 .c{flex:1;background:var(--c);--chip:#fff}
.r1 .c:nth-child(1){--k:0}.r1 .c:nth-child(2){--k:1}.r2 .c:nth-child(1){--k:2}.r2 .c:nth-child(2){--k:3}

/* ===== KARTU: semua kotak persegi bersudut tajam. Tata letak, ukuran dan sisi berbeda tiap halaman ===== */
/* ===== WIDGET: grid rapi 2 kolom, kartu seragam ===== */
.vp{height:auto;transition:height .3s ease}
.pgs{align-items:flex-start;height:auto}
.pgs .pg{padding:14px 12px 12px;min-width:0}
.gl{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:14px;align-items:stretch}
.gl>.c{width:auto;min-width:0;min-height:98px;overflow:hidden;flex:none}
.gl>.c.wd,.gl>.c.tl{grid-column:1/-1}
.gl>.c:nth-child(1){--k:0}.gl>.c:nth-child(2){--k:1}.gl>.c:nth-child(3){--k:2}.gl>.c:nth-child(4){--k:3}
.gl .c,.gl .c *,.gl .c::before,.gl .c::after{border-radius:0!important}
.c{--sh:4px 4px 0 var(--ink);--shh:6px 6px 0 var(--ink);box-shadow:var(--sh);background:#fff;--r:0deg}
a.c:hover{box-shadow:var(--shh)}
a.c:active{box-shadow:0 0 0 transparent}
.c .perf::before,.c .perf::after{content:none}
.c .ring{background:linear-gradient(to top,var(--ink) calc(var(--p)*1%),#fff 0)}
.c .now::before{border-radius:0}
.tab{position:relative}
.tab.on::after{content:"";position:absolute;left:0;bottom:0;height:5px;background:var(--ink);animation:tabfill 6s linear both}
#dash.hold .tab.on::after{display:none}

.panel{width:100%;max-width:440px;margin:0 auto;border-width:4px;box-shadow:8px 8px 0 var(--ink);padding:12px 0 10px}
.tabs{padding:0 12px;gap:6px;margin-bottom:2px}
.tab{padding:8px 2px;font-size:12px;border-width:3px;box-shadow:3px 3px 0 var(--ink)}
.dots{padding-top:4px;gap:10px}
.dots button{width:12px;height:12px}

/* isi kartu */
.gl .c{--pd:12px}
.gl .c-h{margin-bottom:0}
.gl .c-h span{font-size:11px;padding:3px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl .c-h small{font-size:11px}
.gl .c .n{font-size:20px;margin-top:auto;padding-top:10px}
.gl .c.wd .n,.gl .c.tl .n{font-size:28px;margin-top:8px;padding-top:0}
.gl .c .n.t{font-size:15px;line-height:1.2}
.gl .c .sub{font-size:12px;margin-top:4px}
.gl .c ul{gap:7px;margin-top:10px}
.gl .c li{font-size:12px}
.gl .c li.ck span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gl .sp{height:48px;margin-top:10px}
.gl .perf{margin-top:10px}
.gl .ring{width:52px}
.gl .ring b{font-size:11px}
.gl .badge{width:38px;font-size:18px;box-shadow:2px 2px 0 var(--ink);margin-top:auto}
.gl .hbs{gap:8px;margin-top:10px}
.gl .hl{font-size:12px;margin-bottom:3px}
.gl .hb s,.gl .mt{height:10px;border-width:2px}
.gl .tr{font-size:12px}

/* 1. STRUK */
.s-receipt{--sh:6px 6px 0 var(--ink);--shh:9px 9px 0 var(--ink);background:#fffdf4;border-left-width:8px;border-bottom:4px dashed var(--ink)}
.s-receipt .perf{border-top-style:dashed}
.s-receipt .c-h span{background:var(--ink);color:var(--paper)}
/* 2. MAP */
.s-tab{--sh:-6px 6px 0 var(--ink);--shh:-9px 9px 0 var(--ink);background:var(--c);--chip:#fff;border-bottom-width:10px}
/* 3. MASUK */
.s-coin{--sh:inset 0 0 0 3px var(--c),inset 0 0 0 5px var(--ink),0 7px 0 var(--ink);--shh:inset 0 0 0 3px var(--c),inset 0 0 0 5px var(--ink),0 10px 0 var(--ink);background:var(--c);border-width:5px!important;align-items:center;justify-content:center;text-align:center;padding:6px}
.s-coin .c-h{justify-content:center}
.s-coin .mt{width:70%}
/* 4. KELUAR */
.s-price{--sh:6px -6px 0 var(--ink);--shh:9px -9px 0 var(--ink);border-right:8px solid var(--red)}
/* 5. BUKU */
.s-nb{padding-left:calc(var(--pd) + 18px);background:#fff repeating-linear-gradient(transparent 0 22px,rgba(60,120,255,.2) 22px 23px)}
.s-nb::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:7px;background:repeating-linear-gradient(var(--ink) 0 7px,transparent 7px 20px)}
.s-nb::after{content:"";position:absolute;left:24px;top:0;bottom:0;width:2px;background:var(--red);opacity:.55}
/* 6. NOTE */
.s-note{--sh:8px 0 0 var(--ink);--shh:12px 0 0 var(--ink);background:var(--c);--chip:#fff;border-top-width:10px!important}
/* 7. PROGRES */
.s-arch{--sh:5px 5px 0 var(--ink);--shh:8px 8px 0 var(--ink);background:var(--c);--chip:#fff;border-style:dashed;align-items:center;text-align:center}
.s-arch .row{margin-top:auto;justify-content:center}
/* 8. AKTIF (todo) */
.s-stamp{border:7px double var(--ink)!important;background:var(--c);--sh:5px 5px 0 var(--ink);align-items:center;justify-content:center;text-align:center}
/* 9. HARI INI */
.s-clip{--sh:6px 6px 0 var(--ink);--shh:9px 9px 0 var(--ink);border-top-width:16px!important;background:#fff repeating-linear-gradient(transparent 0 24px,rgba(0,0,0,.07) 24px 25px)}
.s-clip::before{content:"";position:absolute;top:0;left:50%;width:36%;height:7px;margin-left:-18%;background:var(--ink)}
/* 10. BESOK */
.s-tag{--sh:0 0 0 transparent;--shh:5px 5px 0 var(--ink);background:var(--c);--chip:#fff;border-right-width:8px;border-bottom-width:8px}
/* 11. BERIKUTNYA */
.s-bub{--sh:-6px 6px 0 #fff,-6px 6px 0 3px var(--ink);--shh:-9px 9px 0 #fff,-9px 9px 0 3px var(--ink);background:var(--c);--chip:#fff}
/* 12. KALENDER */
.s-cal{--sh:0 6px 0 -2px #fff,0 6px 0 2px var(--ink);--shh:0 9px 0 -2px #fff,0 9px 0 2px var(--ink);text-align:center}
.cal-h{margin:calc(-1*var(--pd)) calc(-1*var(--pd)) 0;padding:2px 0;background:var(--red);color:#fff;border-bottom:3px solid var(--ink);font:800 10px 'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:.5px}
.gl .s-cal .n{font-size:26px}
/* 13. TUGAS AKTIF */
.s-stack{--sh:5px 5px 0 -1px #fff,5px 5px 0 3px var(--ink),10px 10px 0 -1px #fff,10px 10px 0 3px var(--ink);--shh:7px 7px 0 -1px #fff,7px 7px 0 3px var(--ink),13px 13px 0 -1px #fff,13px 13px 0 3px var(--ink)}
/* 14. PRIORITAS */
.s-haz{--sh:6px 6px 0 var(--ink);--shh:9px 9px 0 var(--ink);border-left-width:8px;padding-top:calc(var(--pd) + 8px);padding-bottom:calc(var(--pd) + 8px)}
.s-haz::before,.s-haz::after{content:"";position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(-45deg,var(--ink) 0 6px,var(--yellow) 6px 12px);background-size:200% 100%;animation:hazmove 3s linear infinite}
.s-haz::before{top:0}
.s-haz::after{bottom:0}
/* 15. AKTIF (tugas) */
.s-hex{--sh:6px 6px 0 var(--ink);background:var(--c);--chip:#fff;border-width:5px!important;outline:2px solid var(--ink);outline-offset:-7px;align-items:center;justify-content:center;text-align:center;padding:calc(var(--pd) + 1px)}
/* 16. TERLAMBAT */
.s-stop{--sh:7px 7px 0 var(--ink);--shh:10px 10px 0 var(--ink);border-width:6px!important;align-items:center;justify-content:center;text-align:center}
.s-stop.bad{background:var(--red);color:#fff}
.s-stop.bad .n,.s-stop.bad .sub{color:#fff}

/* ===== normalisasi: semua kartu satu bahasa desain ===== */
.gl>.c{--sh:4px 4px 0 var(--ink);--shh:6px 6px 0 var(--ink);--pd:12px;
  border:3px solid var(--ink)!important;outline:0!important;padding:var(--pd)!important;
  align-items:stretch!important;justify-content:flex-start!important;text-align:left!important}
.gl>.c::before,.gl>.c::after{display:none!important}
.gl>.c.s-receipt{background:#fffdf4}
.gl>.c.s-nb,.gl>.c.s-clip,.gl>.c.s-cal,.gl>.c.s-price,.gl>.c.s-stack,.gl>.c.s-haz{background:#fff}
.gl>.c.s-cal{text-align:center!important}
.gl>.c.s-cal .n{font-size:30px}
.gl>.c.s-arch .row{margin-top:auto;justify-content:flex-start;gap:10px}
.gl>.c.s-price{border-right-width:3px!important;box-shadow:4px 4px 0 var(--red)}
.gl>.c.s-stop.bad{box-shadow:4px 4px 0 var(--ink)}
.gl>.c .c-h{justify-content:space-between}
.gl .fd b{background:var(--ink);color:#fff;border:0;padding:0 6px}
.gl .ring{width:64px}
.gl .ring b{width:72%;font-size:11px}

/* isi */

/* animasi */
.pg:not(.in) .c{opacity:0}
.pg.in:not(.still) .c{animation:pop .85s cubic-bezier(.2,1.3,.4,1) backwards,bob 6s ease-in-out infinite,var(--ex,none);animation-delay:calc(var(--k)*110ms),calc(1.3s + var(--k)*400ms),calc(var(--k)*110ms)}
.pg.in.still .c{animation:bob 6s ease-in-out infinite,var(--ex,none);animation-delay:calc(var(--k)*-1.4s),0s}
.hb s i,.mt i{--an:grow;transform-origin:left}
.sb i{--an:up;transform-origin:bottom}
.ring{--an:fill}
.pg.in:not(.still) :is(.hb s i,.mt i,.sb i,.ring){animation:var(--an) .9s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(350ms + var(--d,0ms))}
.pg.in:not(.still) .c li{animation:slide .45s ease-out backwards;animation-delay:calc(350ms + var(--j,0)*60ms)}
.c li:nth-child(1){--j:0}.c li:nth-child(2){--j:1}.c li:nth-child(3){--j:2}.c li:nth-child(4){--j:3}.c li:nth-child(5){--j:4}
.c li:nth-child(6){--j:5}.c li:nth-child(7){--j:6}.c li:nth-child(8){--j:7}.c li:nth-child(9){--j:8}
.pg.in:not(.still) .c{animation:pop .6s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:calc(var(--k)*80ms)}
.pg.in.still .c{animation:none}
@keyframes pop{from{opacity:0;transform:perspective(900px) translateY(60px) rotateX(30deg) rotate(calc(var(--r) + 7deg)) scale(.86)}60%{opacity:1}to{opacity:1;transform:perspective(900px) translateY(0) rotateX(0deg) rotate(var(--r)) scale(1)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}

@keyframes ringspin{to{transform:rotate(360deg)}}
@keyframes hazmove{to{background-position:-32px 0}}
@keyframes tabfill{from{width:0}to{width:100%}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes up{from{transform:scaleY(0)}}

@keyframes fill{from{--p:0}}

  (function(){
    var PIN = '3431';
    var URL_UNSENT = 'https://zaim0371.github.io/unsent/';
    var card = document.getElementById('unsentCard');
    var ov = document.getElementById('pinOverlay');
    var box = document.getElementById('pinBox');
    var dots = document.querySelectorAll('#pinDots i');
    var err = document.getElementById('pinErr');
    var val = '';

    function render(){
      for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i < val.length);
    }
    function openPin(){
      val = ''; err.textContent = ''; render();
      ov.classList.add('open');
    }
    function closePin(){
      ov.classList.remove('open'); val = ''; render();
    }
    function submit(){
      if (val === PIN){
        window.location.href = URL_UNSENT;
      } else {
        err.textContent = 'PIN salah, coba lagi.';
        box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
        val = ''; render();
      }
    }
    function press(k){
      if (k === 'del'){ val = val.slice(0, -1); err.textContent = ''; }
      else if (k === 'ok'){ if (val.length === 4) submit(); return; }
      else if (val.length < 4){ val += k; err.textContent = ''; }
      render();
      if (val.length === 4) setTimeout(submit, 120);
    }

    card.addEventListener('click', function(e){ e.preventDefault(); openPin(); });
    document.getElementById('pinClose').addEventListener('click', closePin);
    ov.addEventListener('click', function(e){ if (e.target === ov) closePin(); });
    document.getElementById('pinPad').addEventListener('click', function(e){
      var b = e.target.closest('button'); if (b) press(b.getAttribute('data-k'));
    });
    document.addEventListener('keydown', function(e){
      if (!ov.classList.contains('open')) return;
      if (e.key >= '0' && e.key <= '9') press(e.key);
      else if (e.key === 'Backspace') press('del');
      else if (e.key === 'Enter') press('ok');
      else if (e.key === 'Escape') closePin();
    });
  })();
</script>

  /* ---------- chart ---------- */
  function legend(){ return '<div class="xlg"><span class="g">▮ masuk</span><span class="r">▮ keluar</span></div>'; }

      R.map(function(r, i){ return '<text x="' + X(i).toFixed(1) + '" y="' + (H + 12) + '">' + esc(r.l) + '</text>'; }).join('') + '</svg><div class="xmx">maks ' + short(mx) + '</div>';

    { name:'ubah_data', description:'Tambah, ubah, hapus data. area keuangan: jenis, jumlah, kategori, isi(catatan), tanggal. jadwal (KEGIATAN: ujian, rapat, kuliah, janji, acara; bukan tugas): teks, jam, dan salah satu: tanggal (kegiatan SEKALI) atau hari[] + sampai (tiap minggu). tanggal="rutin" saat ubah = jadikan tiap minggu. tugas: teks(judul), isi, deadline, jam(jam deadline), kerjakan_pada, jam_kerjakan, prioritas, selesai. note: teks(judul), isi, warna. folder: teks(nama), warna. todo: teks, folder_id atau folder_nama, selesai. wish: teks(nama), jumlah(harga), prioritas tinggi/sedang/rendah, selesai(didapat). Hapus banyak pakai ids.',
      parameters:{ type:'OBJECT', properties:{
        area:S('', ['keuangan','jadwal','tugas','note','folder','todo','wish']), aksi:S('bersihkan = hapus to do yang selesai', ['tambah','ubah','hapus','bersihkan']),
        id:S(), ids:{ type:'ARRAY', items:S() }, teks:S(), isi:S(), warna:S('', COLN), jumlah:{ type:'NUMBER' }, jenis:S('', ['masuk','keluar']), kategori:S(),
        tanggal:S('YYYY-MM-DD. Keuangan: tanggal transaksi. Jadwal: tanggal kegiatan sekali'), deadline:S('YYYY-MM-DD'), jam:S('HH:MM'), kerjakan_pada:S('YYYY-MM-DD'), jam_kerjakan:S('HH:MM'), prioritas:S(),
        hari:{ type:'ARRAY', items:S('Senin..Minggu atau semua') }, sampai:S('YYYY-MM-DD, kosong/permanen = tanpa batas'), folder_id:S(), folder_nama:S(), selesai:{ type:'BOOLEAN' }
      }, required:['area','aksi'] } },
    { name:'buka_web', description:'Pindah ke halaman web. tujuan: manager, secretary, workspace, confidant, brain, unsent (minta PIN), atau isi url untuk situs lain',
      parameters:{ type:'OBJECT', properties:{ tujuan:S('', ['manager','secretary','workspace','confidant','brain','unsent','lainnya']), url:S('hanya untuk tujuan lainnya') }, required:['tujuan'] } },
    { name:'popup', description:'Tampilkan data dalam popup. Pakai sumber agar data diambil langsung dari database (akurat), dengan filter opsional. Untuk hasil olahan sendiri pakai kolom dan baris (tiap baris string, sel dipisah |), atau teks saja.',
      parameters:{ type:'OBJECT', properties:{ judul:S(), sumber:S('', ['transaksi','jadwal','tugas','note','todo','wish','folder']), kata:S('filter teks'), status:S('', ['aktif','selesai','semua']),
        jenis:S('khusus transaksi', ['masuk','keluar']), dari:S('YYYY-MM-DD'), sampai:S('YYYY-MM-DD'), kolom:{ type:'ARRAY', items:S() }, baris:{ type:'ARRAY', items:S() }, teks:S('catatan di bawah tabel') } } }
  ] }];

var RULES = `
CARA MEMAHAMI PERMINTAAN
1) Tentukan jenis data dulu. JADWAL (area jadwal): kata jadwal, kegiatan, acara, agenda, atau hal yang TERJADI pada hari/jam tertentu: ujian, kuliah, kelas, rapat, meeting, janji, les, latihan, olahraga, ibadah, sidang, wawancara, tes, ulang tahun, shift. TUGAS (area tugas): kata tugas, PR, to do, deadline, kumpulkan, kerjakan, selesaikan, atau pekerjaan yang bisa ditandai selesai. KEUANGAN: beli, bayar, jajan, gaji, transfer, nominal Rp/rb/k/jt.
2) Kata "jadwal" TIDAK PERNAH menjadi tugas. "Tambahin jadwal hari Rabu kegiatan ujian" = area jadwal, teks "Ujian", tanggal Rabu terdekat. BUKAN area tugas.
3) Jadwal SEKALI (isi tanggal): ujian, tes, sidang, wawancara, janji, rapat tertentu, acara, ulang tahun, atau ada tanggal/besok/lusa/"Rabu ini"/"minggu depan". Jadwal TIAP MINGGU (isi hari): ada kata setiap/tiap/rutin/mingguan, atau kegiatan berulang (kuliah, kelas, les, latihan, olahraga, ibadah) tanpa tanggal. Kalau ragu pilih yang paling wajar, sebut di laporan, jangan tanya dulu.
4) Tanggal: pakai tabel "kalender" di data, jangan hitung sendiri. Nama hari tanpa keterangan = hari itu terdekat ke depan (hari ini termasuk). "Rabu depan" = minggu berikutnya. Jam: "jam 7"/"7 pagi" = 07:00, "2 siang" = 14:00, "7 malam" = 19:00, "setengah 8" = 07:30. Jangan mengarang jam.
5) Satu pesan bisa berisi beberapa perintah: kerjakan semuanya. Cek data dulu agar tidak duplikat.
6) Koreksi user ("bukan tugas, jadwal", "salah", "harusnya Kamis"): perbaiki data yang baru kamu buat (hapus yang salah, buat yang benar atau ubah) tanpa tanya.
7) Nominal: 25rb/25k = 25000, 1,5jt = 1500000. Tanpa mata uang = Rupiah.
8) Setelah selesai, laporkan 1-2 kalimat: apa yang berubah, lengkap dengan hari dan tanggal.`;
  function system(){
    var D = A.D, m = D.mg, d = new Date(), ym = today().slice(0, 7), mo = m.tx.filter(function(x){ return String(x.date).slice(0, 7) === ym; });
    var fn = {}; D.folders.forEach(function(f){ fn[f.id] = f.name; });
    var data = JSON.stringify({
      hari_ini:today() + ' ' + DAYS[(d.getDay() + 6) % 7],
      kalender:Array.from({ length:21 }, function(_, i){ var x = new Date(); x.setDate(x.getDate() + i); return DAYS[(x.getDay() + 6) % 7] + ' ' + iso(x) + (i === 0 ? ' (hari ini)' : i === 1 ? ' (besok)' : i === 2 ? ' (lusa)' : ''); }),
      keuangan:{ saldo:sum(m.tx, 'in') - sum(m.tx, 'out'), masuk_bulan_ini:sum(mo, 'in'), keluar_bulan_ini:sum(mo, 'out'), jumlah_transaksi:m.tx.length,
        transaksi:m.tx.slice().sort(function(p, q){ return String(q.date).localeCompare(String(p.date)) || (Number(q.id) || 0) - (Number(p.id) || 0); }).slice(0, 120)
          .map(function(x){ return { id:x.id, tgl:x.date, jenis:x.type === 'in' ? 'masuk' : 'keluar', jumlah:x.amt, kategori:x.cat || '', catatan:x.note || '' }; }) },
      jadwal:DAYS.map(function(n, i){ return { hari:n, kegiatan:(m.sched[i] || []).filter(function(it){ return !it.taskId; }).map(function(it){ return { id:it.id, teks:it.text, jam:it.time || '', tipe:it.date ? 'sekali' : 'tiap minggu', tanggal:it.date || '', sampai:it.until || 'permanen' }; }) }; }),
      tugas:m.tasks.slice(-60).map(function(t){ return { id:t.id, judul:t.title, catatan:t.note || '', deadline:t.deadline || '', jam:t.time || '', kerjakan_pada:t.doOn || '', jam_kerjakan:t.doTime || '', prioritas:PRIO[t.prio] || '', selesai:!!t.done }; }),
      note:D.notes.slice(-25).map(function(n){ var b = n.body || ''; return { id:n.id, judul:n.title, isi:b.slice(0, 300), warna:COLN[COL.indexOf(n.color)] || '' }; }),
      folder:D.folders.map(function(f){ return { id:f.id, nama:f.name }; }),
      todo:D.todos.map(function(t){ return { id:t.id, folder:fn[t.fid] || '', folder_id:t.fid, teks:t.text, selesai:!!t.done }; }),
      wish:D.wish.map(function(w){ return { id:w.id, nama:w.name, harga:w.price, prioritas:['', 'tinggi', 'sedang', 'rendah'][w.prio] || '', didapat:!!w.got }; })
    });
    return 'Kamu asisten di "Zaim\'s Office" dengan akses penuh ke data Manager (keuangan, jadwal rutin, tugas) dan Secretary (note, folder dan to do, wish). Jawab bahasa Indonesia, santai dan singkat. Perintah jelas langsung kerjakan lewat tool; pakai id dari data, jangan mengarang. Tanya balik hanya jika item ambigu. Sebelum menghapus banyak item sekaligus, atau semua data, konfirmasi dulu. Untuk "tampilkan/munculin/lihat data" pakai tool popup dengan sumber. Untuk "buka/lompat/ke web" pakai buka_web. Unsent terkunci PIN: hanya buka kolom PIN, jangan coba menebak PIN. File di galeri Manager tidak bisa diubah dari sini.' + RULES + '\nDATA: ' + data;
  }

  async function aiTry(m,obj,tb,lim,ctl){
  for(const th of [true,false]){
    const gc=Object.assign({temperature:.2,maxOutputTokens:4096},obj.generationConfig||{},th?{thinkingConfig:{thinkingBudget:tb}}:{});
    const tm=setTimeout(()=>ctl.abort(),lim);
    let r;
    try{r=await fetch(gUrl(m),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...obj,generationConfig:gc}),signal:ctl.signal})}
    catch(e){clearTimeout(tm);if(e&&e.name==='AbortError')throw {s:408,m:'Terlalu lama'};throw e}
    clearTimeout(tm);
    if(r.ok)return {m,d:await r.json()};
    const j=await r.json().catch(()=>null),er={s:r.status,m:(j&&j.error&&j.error.message)||''};
    if(r.status===400&&th&&!/API key/i.test(er.m))continue;
    throw er;
  }
}
/* respon cepat: model tercepat dulu; kalau belum membalas dalam beberapa detik, model cadangan jalan paralel dan yang pertama selesai dipakai */
function call(obj,tb){
  if(tb===undefined)tb=0;   // tanpa "thinking" = jauh lebih cepat
  const img=JSON.stringify(obj).indexOf('"inlineData"')>-1;
  const base=vertex()?(img?V_IMG:V_MODELS):(img?MODELS_IMG:MODELS);
  const list=!img&&A.model?[A.model].concat(base.filter(x=>x!==A.model)):base;
  const lim=img?35000:15000,hedge=img?7000:2500;
  return new Promise((resolve,reject)=>{
    const ctls=[];let done=false,idx=0,pending=0,last={s:404,m:'Model tidak ditemukan'},timer=null,cap=null;
    const finish=(fn,v)=>{if(done)return;done=true;clearTimeout(timer);clearTimeout(cap);ctls.forEach(c=>{try{c.abort()}catch(e){}});fn(v)};
    const next=()=>{
      if(done)return;
      if(idx>=list.length){if(!pending)finish(reject,last);return}
      const m=list[idx++],ctl=new AbortController();ctls.push(ctl);pending++;
      clearTimeout(timer);timer=setTimeout(next,hedge);
      aiTry(m,obj,tb,lim,ctl).then(r=>{if(!done){A.model=r.m;finish(resolve,r.d)}},e=>{
        pending--;if(done)return;
        const s=e&&e.s;
        if(s&&([404,408,429,500,503].includes(s)||(s===400&&!/API key/i.test(e.m||'')))){last=e;next()}
        else finish(reject,e);
      });
    };
    cap=setTimeout(()=>finish(reject,{s:408,m:'Terlalu lama'}),img?60000:30000);
    next();
  });
}
window.OFC = window.OFC || {}; window.OFC.ai = { call: call, has: function(){ return !!key(); } };
async function run(name, a){
    try{
      if (name === 'ubah_data') return await mutate(a);
      if (name === 'buka_web') return web(a);
      if (name === 'popup') return popup(a);
      return 'tool tidak dikenal';
    }catch(e){ return 'error: ' + String(e && (e.m || e.message) || e).slice(0, 140); }
  }
  async function send(text){
    text = text.trim(); if (A.busy || !text) return;
    A.busy = true; var sg = box.querySelector('.chips'); if (sg) sg.remove();
    var base = A.msgs.length, acted = false;
    add('u', text); A.dots = add('a', '…');
    try{
      await fresh();
      A.msgs.push({ role:'user', parts:[{ text:text }] });
      while (A.msgs.length > 14){ A.msgs.shift(); while (A.msgs.length && !(A.msgs[0].role === 'user' && A.msgs[0].parts[0] && A.msgs[0].parts[0].text !== undefined)) A.msgs.shift(); }
      for (var i = 0; i < 12; i++){
        var d = await call({ systemInstruction:{ parts:[{ text:system() }] }, tools:TOOLS, contents:A.msgs });
        var c = d.candidates && d.candidates[0], ps = (c && c.content && c.content.parts) || [];
        if (!ps.length) throw { s:200, m:'Balasan kosong' };
        A.msgs.push({ role:'model', parts:ps });
        var tx = ps.filter(function(x){ return x.text && !x.thought; }).map(function(x){ return x.text; }).join('\n').trim();
        if (tx) add('a', tx);
        var fc = ps.filter(function(x){ return x.functionCall; }); if (!fc.length) break;
        acted = true; var out = [];
        for (var f of fc) out.push({ functionResponse:{ name:f.functionCall.name, response:{ result:await run(f.functionCall.name, f.functionCall.args || {}) } } });
        A.msgs.push({ role:'user', parts:out });
        // semua tool sukses & tidak butuh id baru: tidak perlu panggilan AI kedua hanya untuk merangkum
        if (out.every(function(x){ return /^ok/.test(String(x.functionResponse.response.result)); }) &&
            !fc.some(function(f){ var q = f.functionCall.args || {}; return q.area === 'folder' && q.aksi === 'tambah'; })){
          A.msgs.push({ role:'model', parts:[{ text:tx || 'Selesai.' }] }); break;
        }
      }
    }catch(e){
      if (!acted) A.msgs.length = base;
      var m = String(e && e.m || '');
      add('a', /API key/i.test(m) || (e && (e.s === 401 || e.s === 403)) ? 'Key tidak valid' : e && e.s === 408 ? 'Server terlalu lama, coba kirim lagi' : e && e.s === 429 ? 'Terlalu sering, tunggu'
        : (e instanceof TypeError || /fetch|network/i.test(String(e && e.message))) ? 'Jaringan gagal' : e && e.s ? 'Gagal (' + e.s + ') ' + m.slice(0, 90) : (m || 'Error') );
    }
    A.dots.remove(); A.dots = null; A.busy = false;
  }

  /* ---------- event ---------- */
  function go(){ var i = $('#aiI'), v = i.value; i.value = ''; send(v); }
  function saveKey(){ var v = $('#aiKi').value.trim(); if (!v) return; mem = v; try{ localStorage.setItem(KEY, v); }catch(x){} $('#aiKi').value = ''; $('#aiKey').hidden = true; view(); suggest(); $('#aiI').focus(); if (window.OFC && window.OFC.summ) window.OFC.summ(true); }
  $('#aiFab').addEventListener('click', open);
  $('#aiX').addEventListener('click', close);
  $('#aiPx').addEventListener('click', closePop);
  sheet.addEventListener('click', function(e){
    if (e.target === sheet) return close();
    var b = e.target.closest('[data-s],[data-p]'); if (!b) return;
    if (b.dataset.s) return send(b.dataset.s);
    var i = $('#aiI'); i.value = b.dataset.p; i.focus();
  });
  pop.addEventListener('click', function(e){ if (e.target === pop) closePop(); });
  $('#aiGear').addEventListener('click', function(){ $('#aiKey').hidden = !$('#aiKey').hidden; view(); if (!$('#aiKey').hidden) $('#aiKi').focus(); });
  $('#aiSave').addEventListener('click', saveKey);
  $('#aiGo').addEventListener('click', go);
  $('#aiKi').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); saveKey(); } });
  $('#aiI').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); go(); } });
  $('#aiDel').addEventListener('click', function(){ mem = ''; try{ localStorage.removeItem(KEY); }catch(x){} $('#aiKi').value = ''; $('#aiKey').hidden = false; view(); });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (pop.classList.contains('open')) closePop(); else if (sheet.classList.contains('open')) close();
  });
})();
